name: Build & Deploy

# Push to main and https://prochestait.com updates itself.
#
# This is a fully static site (`output: "export"` in next.config.ts), so the
# runner builds it and the server just serves files — no Node process, no
# Passenger app, nothing to restart.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST || 'prochestait.com' }}
      SSH_USER: ${{ secrets.SSH_USER || 'prochest' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/prochest/public_html' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://prochestait.com' }}

      # Inlined into the bundle at BUILD time and baked into the exported HTML —
      # not read at runtime. Changing it means re-running this workflow.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://admin.nixsoftware.net/api' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every page is prerendered here, and the [slug] routes call
      # generateStaticParams against NEXT_PUBLIC_API_URL — so this step fails if
      # that API is unreachable. That is deliberate: better a red build than a
      # green deploy that silently publishes a site with no projects on it.
      - name: Build and export
        run: |
          set -euo pipefail
          npm run build

          [ -f out/index.html ] || { echo "::error::export produced no out/index.html"; exit 1; }
          echo "Exported $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY is not set."
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pinning the host key is what stops a DNS or routing hijack from
          # collecting this deploy key. Keyscan trusts whatever answers first.
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set; trusting whatever ssh-keyscan returns."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      # NOT rsync. This cPanel host has no rsync binary, and rsync needs it on
      # both ends — the previous burnett01/rsync-deployments step could never
      # have worked here. tar + scp use only what the server actually has.
      - name: Package and upload
        run: |
          set -euo pipefail
          tar -czf /tmp/site.tar.gz --owner=0 --group=0 -C out .
          echo "Payload: $(du -h /tmp/site.tar.gz | cut -f1)"

          ssh deploy-target 'mkdir -p "$HOME/deploy-tmp"'
          # HOME-relative with no leading "~/": OpenSSH 9+ runs scp over SFTP,
          # which does not shell-expand ~ and would create a directory literally
          # named "~". Relative paths resolve against $HOME under both protocols.
          scp /tmp/site.tar.gz deploy-target:deploy-tmp/site.tar.gz

      # A static site wants true --delete semantics: a page removed from the
      # repo must stop being served. So this prunes the docroot rather than only
      # replacing what it ships — with an explicit keep-list, because the docroot
      # is not ours alone.
      #
      # .well-known MUST survive: cPanel AutoSSL writes its ACME challenge
      # there, and deleting it breaks certificate renewal. The old
      # `rsync --delete` into public_html would have wiped it.
      #
      # .htaccess is in the keep-list only as a fallback for a build that ships
      # none. This repo DOES ship one (public/.htaccess → out/.htaccess), so the
      # repo's version overwrites whatever is on the server — deliberately: it
      # carries the HTTPS redirect, DirectoryIndex, ErrorDocument 404 and cache
      # headers this site needs. cPanel's PHP handler block is replaced along
      # with it, which is harmless for a site that serves no PHP.
      - name: Publish
        run: |
          set -euo pipefail
          ssh deploy-target "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          STAGING="$DEPLOY_PATH/.deploy-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          tar -xzf "$HOME/deploy-tmp/site.tar.gz" -C "$STAGING"

          # Verify BEFORE deleting anything. A truncated upload must not take
          # the live site down.
          [ -f "$STAGING/index.html" ] || { echo "Upload has no index.html; refusing."; exit 1; }

          cd "$DEPLOY_PATH"
          shopt -s dotglob nullglob
          for entry in *; do
            case "$entry" in
              .htaccess|.well-known|cgi-bin|.deploy-staging) continue ;;
              ''|'.'|'..'|*/*) echo "Refusing suspicious entry: '$entry'"; exit 1 ;;
            esac
            rm -rf "$entry"
          done

          cd "$STAGING"
          count=0
          for entry in *; do
            mv "$entry" "$DEPLOY_PATH/$entry"
            count=$((count + 1))
          done
          shopt -u dotglob nullglob

          cd "$DEPLOY_PATH"
          rm -rf "$STAGING" "$HOME/deploy-tmp/site.tar.gz"
          echo "Published $count top-level entries to $DEPLOY_PATH."
          REMOTE

      - name: Smoke-test
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/")"
          [ "$code" = "200" ] || { echo "::error::$SITE_URL/ returned $code"; exit 1; }
          curl -s --max-time 30 "$SITE_URL/" | grep -q '<title>' \
            || { echo "::error::homepage served no <title>"; exit 1; }
          echo "$SITE_URL/ -> 200"
